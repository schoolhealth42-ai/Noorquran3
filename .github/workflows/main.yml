name: Build APK
on:
  push:
  workflow_dispatch:
env:
  APP_NAME: "Noorquran2"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Prepare project
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -q -o "$z" -d _unzipped; done
          P=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          grep -q kotlin-bom "$P/app/build.gradle.kts" || echo 'dependencies { implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")) }' >> "$P/app/build.gradle.kts"
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$APP_NAME</string>|" "$P/app/src/main/res/values/strings.xml"
          echo "PROJ=$P" >> $GITHUB_ENV
      - name: Build
        run: gradle -p "$PROJ" assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NoorQuran-APK
          path: "**/app/build/outputs/apk/release/*.apk"
